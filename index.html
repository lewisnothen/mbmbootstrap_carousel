<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

     <link rel="icon" type="image/x-icon" href="Cars/Lamborghini-Logo.png">

    <style>
        .card-text {
            padding: 40px;
            color: black;
        }

        .card-text p {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .card-text h1 {
            text-transform: uppercase;
            font-weight: 500;
            color: #ddd;
            text-align: center;
        }

        /* Ensure images scale nicely inside the overlay layout */
        .car-img {
            height: 380px;
            object-fit: contain;
        }

        .lambo{
            color: rgba(95, 113, 213, 0.827);
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0">
        <div class="card p-0 position-relative border-0">
            <!-- Background Image -->
            <img src="Cars/Bg of cars .jpg" 
                 width="100%" height="500px" style="object-fit: cover;" alt="background">

            <!-- Carousel placed inside overlay -->
            <div class="card-img-overlay p-0">
                <div class="carousel slide h-100" id="car" data-bs-ride="carousel">

                    <!-- Carousel Indicators -->
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#car" data-bs-slide-to="0" class="active"></button>
                        <button type="button" data-bs-target="#car" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#car" data-bs-slide-to="2"></button>
                    </div>

                    <!-- Carousel Slides (Image + Text together) -->
                    <div class="carousel-inner h-100">

                        <!-- Slide 1: Aston Martin -->
                        <div class="carousel-item active h-100">
                            <div class="d-flex justify-content-around align-items-center h-100 px-5">
                                <img src="Cars/Aston Martin.png" class="car-img" alt="Aston Martin DB12">
                                <div class="card-text">
                                    <p>High-performance grand tourer marketed <br>as the world's first "Super Tourer,"</p>
                                    <h1 class="text-secondary">Aston Martin DB12</h1>
                                </div>
                            </div>
                        </div>

                        <!-- Slide 2: Lamborghini -->
                        <div class="carousel-item h-100">
                            <div class="d-flex justify-content-around align-items-center h-100">
                                <img src="Cars/Lambo Aventador.png" class="car-img" alt="Lamborghini Aventador">
                                <div class="card-text ">
                                    <p>Flagship, mid-engine V12 sports car <br>produced by Italian</p>
                                    <h1 style=" color: rgba(95, 113, 213, 0.827);">Lamborghini Aventador</h1>
                                </div>
                            </div>
                        </div>

                        <!-- Slide 3: Ferrari -->
                        <div class="carousel-item h-100">
                            <div class="d-flex justify-content-around align-items-center h-100 px-5">
                                <img src="Cars/Ferrari SF90.png" class="car-img" alt="Ferrari SF90">
                                <div class="card-text">
                                    <p>Mid-engine plug-in hybrid sports <br>produced by Italian automobile</p>
                                    <h1 style="color: red;">Ferrari SF90</h1>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Carousel Controls -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#car" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#car" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                        <span class="visually-hidden">Next</span>
                    </button>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
